# ClearItemKhang v1.2.0 - Lao công may mắn (tiếng Việt có dấu)

# Mỗi bao nhiêu phút dọn 1 lần
interval-minutes: 5

# Cảnh báo trước bao nhiêu giây (đếm ngược 5..1 giây cuối)
warning-seconds: 10

# {player} = lao công may mắn (random online), {seconds} = số giây còn lại
warn-message: "&6[🧹 Lao Công] &eLao công may mắn của ngày hôm nay &b{player} &esẽ đến dọn dẹp sau &c{seconds} &egiây nữa, nhớ cất đồ kĩ vào!"
# Khi không có ai online -> bỏ trống tên
warn-empty-message: "&6[🧹 Lao Công] &eSẽ đến dọn dẹp sau &c{seconds} &egiây nữa, nhớ cất đồ kĩ vào!"

# Đếm ngược 5..1 (chỉ hiện nếu warning-seconds >= số giây đó)
countdown-message: "&6[🧹 Lao Công] &eDọn dẹp sau &c{seconds} &egiây...!"

# {player} = lao công, {count} = số vật phẩm, {minutes} = chu kỳ
# Chỉ broadcast khi count > 0
done-message: "&6[🧹 Lao Công] &b{player} &eđã dọn xong &c{count} &evật phẩm rơi!"
done-empty-message: "&6[🧹 Lao Công] &eĐã dọn xong &c{count} &evật phẩm rơi!"

# Log console?
console-log: true
